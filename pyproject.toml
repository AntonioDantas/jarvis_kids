[project]
name = "jarvis-kids"
version = "1.0.0"
description = "Assistente de voz 100% local, católico e gamificado para crianças de 9 a 12 anos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["config", "jarvis", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
